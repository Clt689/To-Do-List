<!DOCTYPE html>
<html lang="en" style="display: flex; justify-content: center; height: 100%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body class="body">
    <header class="header">
      <h1 style="font-size: 40px">To Do List ✅</h1>
      <h3>2025. 12. 25 (목)</h3>
    </header>
    <main class="main-container">
      <div class="search-container">
        <input class="searchbar" placeholder="검색어를 입력하세요..." />
        <button class="search-button">검색</button>
      </div>
      <div class="add-button-container">
        <button class="add-todo-button">+ 추가하기</button>
      </div>
    </main>
    <section class="todo-container">
      <div class="todo-task">
        To Do 1
        <input type="checkbox" class="todo-checkbox" />
      </div>
      <div class="todo-task">
        빨래하기
        <input type="checkbox" class="todo-checkbox" />
      </div>
      <div class="todo-task">
        노래방가기🎤🎵
        <input type="checkbox" class="todo-checkbox" />
      </div>
    </section>
  </body>
</html>
